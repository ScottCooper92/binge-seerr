# The module's Robolectric defaults, read for every test in it.
#
# sdk: without this a test falls back to targetSdk, and SDK 36's sandbox requires Java 21. CI
# builds on JDK 17, so such a test dies before its body runs — passing locally on a newer JDK and
# failing in CI, which is the inverse of the failure a contributor expects.
#
# application: the real one is @HiltAndroidApp, and a test that wanted Hilt would say so itself.
#
# RobolectricDefaultsTest is the guard: it asserts both, so a test that stops reading this file
# fails loudly rather than reaching CI.
sdk=34
application=android.app.Application
#
# shadows: the design system's hero mesh wash builds a MeshSpecification from Compose UI 1.13, which
# Robolectric ships no native for; ShadowMeshSpecification is the design system's test fixture for it.
shadows=com.binge.designsystem.testing.ShadowMeshSpecification
