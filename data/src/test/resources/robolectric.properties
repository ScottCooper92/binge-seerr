# The module's Robolectric defaults, read for every test in it.
#
# sdk: without this a test falls back to targetSdk, and SDK 36's sandbox requires Java 21. A
# contributor building on JDK 17 would see such a test die before its body runs, while it passes on
# JDK 21, which is what CI uses.
#
# application: this module has no Application of its own, so a test gets the plain one.
#
# RobolectricDefaultsTest is the guard: it asserts both, so a test that stops reading this file
# fails loudly rather than reaching CI.
sdk=34
application=android.app.Application
