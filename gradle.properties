# The daemon's defaults are sized for a plain JVM build. This one configures AGP, the Kotlin
# compiler and an included build in one process, and without a Metaspace ceiling above the
# default it thrashes on `OutOfMemoryError: Metaspace` instead of failing.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Preview Screenshot Testing (#146). The flag is what makes AGP create the screenshotTest
# source set; the heap override is the plugin's own knob for the forked render and validate JVMs,
# which otherwise get Gradle's 512m default and die inside layoutlib. Both match what the design
# system and Binge already set, so a baseline recorded in one renders the same in the others.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=2g
