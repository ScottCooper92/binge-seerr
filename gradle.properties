# The daemon's defaults are sized for a plain JVM build. This one configures AGP, the Kotlin
# compiler and an included build in one process, and without a Metaspace ceiling above the
# default it thrashes on `OutOfMemoryError: Metaspace` instead of failing.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Compose Preview Screenshot Testing (#146). The flag is what makes AGP create the screenshotTest
# source set; the heap override is the plugin's own knob for the forked render and validate JVMs,
# which otherwise get Gradle's 512m default and die inside layoutlib. It is 3g: at 2g the render
# ran out of memory on the two tallest foldable frames (a "Java heap space" in StandaloneRecyclableImage.getCopy,
# after about 13 minutes), and validation ran out building the diff images when about 200 frames differed
# (DiffUtils.generatePixelDiffImage). At 4g two CI runs were killed by a runner shutdown signal during validation.
# Do not lower it to save time: the cost is a red build that hides which frames changed.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=3g
