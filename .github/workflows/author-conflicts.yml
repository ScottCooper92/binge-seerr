name: Author - resolve merge conflicts

# What set this run off. This one sweeps every conflicted PR rather than acting on one, so it is
# named for the branch whose CI finished - a PR number here would name whichever PR happened to be
# first in the matrix. Without it, a workflow_run run reads as the default branch every time.
run-name: >-
  ${{ github.event.workflow_run.head_branch
        && format('sweep after {0}', github.event.workflow_run.head_branch)
      || 'sweep · dispatched' }}

# Thin caller. The workflow itself lives in ScottCooper92/binge-ci.
#
# PUBLIC repository: the fork filter inside the scan is the control here, not a
# formality. The `agent` label stays maintainers-only.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  resolve:
    # Skip the scheduled canary run of CI: it has no PR to review, fix or rebase.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'schedule'
    uses: ScottCooper92/binge-ci/.github/workflows/author-conflicts.yml@v1
    with:
      dispatched: ${{ github.event_name == 'workflow_dispatch' }}
      author_bot_id: ${{ vars.AUTHOR_BOT_ID }}
      conflict_rules: |
        Three kinds of file are never yours to arbitrate.

        detekt-baseline.xml is a set of one-line entries, and both an added
        entry and a removed one are deliberate human decisions: an addition
        suppresses a gate, a removal pays one down. So a conflict in it is a
        three-way set merge, never a union of the two sides. Take base from
        `git merge-base HEAD MERGE_HEAD` and compute
        (base ∩ ours ∩ theirs) ∪ (ours − base) ∪ (theirs − base): an entry
        either side added stays, and an entry either side removed stays gone.
        Keeping every line from both sides of the hunk puts back entries one
        side deleted, and nothing in CI notices.

        translation-hashes.txt is derived, so it is never hand-merged. Take
        the merged strings.xml files first, then regenerate it with
        `./gradlew updateTranslationHashes`.

        A conflict in a screenshot baseline PNG under
        app/src/screenshotTestDebug/reference/ cannot be merged at all:
        picking a side means choosing which rendering is correct, which is a
        human's call. Leave it unresolved and say so in note.md rather than
        guessing.

        Beyond those files, this is the reference companion, and its code is
        read and copied. A conflict resolved into something that merely
        compiles is a worse outcome here than one handed back - if the two
        sides disagree about how the example should read, that is a human's
        call. Leave it unresolved and say so in note.md.
    secrets:
      AUTHOR_APP_ID: ${{ secrets.AUTHOR_APP_ID }}
      AUTHOR_APP_PRIVATE_KEY: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
