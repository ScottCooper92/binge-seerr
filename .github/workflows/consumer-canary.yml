name: Consumer canary

# Builds this app against the HEADS of design-system/ and binge-companions/ instead of the
# commits pinned here. Both upstreams say a green build in their repository does not mean a green
# build in their consumers, and this app is where a breaking change on their main first shows. CI
# only ever builds the pins, so without this the break surfaces in the bump PR.
#
# A separate workflow with its own name, deliberately. bot-review, author-ci-fix and
# author-conflicts match CI by NAME (`workflows: ["CI"]`), so a job added to ci.yml would be a
# second thing for them to reason about, and this one has no PR to act on. Under this name they
# never see it. It only answers "would a bump be green"; it never commits the bump.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: consumer-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same slices ci.yml runs as parallel jobs, as a matrix: one serial `./gradlew build` outgrew the 30 minutes a
  # job gets (#1630). The screenshots are three slices, one per shard of ci.yml's split. Each slice resolves the upstream
  # heads itself. `canary-report` below reads the matrix's aggregate result.
  canary:
    name: canary (${{ matrix.slice }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: checks
            timeout: 30
            command: ./gradlew build --continue -x testDebugUnitTest -x koverVerify -x validateDebugScreenshotTest -x assembleRelease
          - slice: tests
            timeout: 30
            command: ./gradlew testDebugUnitTest koverVerify --continue
          # The screenshots in the three shards ci.yml uses, so each renders in a JVM of its own and in the 20 minutes ci.yml gives
          # a shard (#2249). One JVM for every frame took 45 minutes and was killed on the runner (#2181).
          - slice: screenshots-0
            timeout: 20
            shard: 0
            shards: 3
          - slice: screenshots-1
            timeout: 20
            shard: 1
            shards: 3
          - slice: screenshots-2
            timeout: 20
            shard: 2
            shards: 3
          - slice: release
            timeout: 30
            command: ./gradlew assembleRelease --continue
    steps:
      # The submodules are private to the author: the default token reads this repository only. This one is read-only.
      - name: Mint a read-only token for the submodules
        id: submodule_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: binge-seerr,homelab-core,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.submodule_token.outputs.token }}

      # Moves each submodule to the tip of its remote's default branch in the working tree only.
      - name: Move the submodules to their upstream heads
        run: |
          set -euo pipefail
          git submodule update --init --remote design-system binge-companions
          # Their own submodules at the pins those heads carry, not at their remotes' heads: the
          # canary asks whether this app builds against the latest of each, as each is shipped.
          git submodule foreach --quiet 'git submodule update --init --recursive'
          git submodule status --recursive

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Build the ${{ matrix.slice }} slice
        if: ${{ !startsWith(matrix.slice, 'screenshots') }}
        run: ${{ matrix.command }}

      # As in ci.yml: a cold compile and the render sharing one VM ran it out of memory, so the sources compile first.
      - name: Compile screenshot sources
        if: ${{ startsWith(matrix.slice, 'screenshots') }}
        run: ./gradlew :app:compileDebugScreenshotTestKotlin --max-workers=2

      - name: Validate screenshots (shard ${{ matrix.shard }} of ${{ matrix.shards }})
        if: ${{ startsWith(matrix.slice, 'screenshots') }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          mapfile -t filters < <(.github/scripts/shard-screenshots.sh "$SHARDS" "$SHARD")
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "shard $SHARD has no classes; an empty filter would run the whole suite in one JVM" >&2
            exit 1
          fi
          printf '%s\n' "${filters[@]}" | paste - - | sed 's/^/  /'
          ./gradlew --stop
          ./gradlew :app:validateDebugScreenshotTest --continue "${filters[@]}"

      # As in ci.yml: UncaughtExceptionsBeforeTest names the test that ran next, never the coroutine that leaked, and this
      # report does. Printing it keeps the answer in the log rather than only in the artifact (#807).
      - name: Print the coroutine leak report
        if: ${{ failure() && matrix.slice == 'tests' }}
        run: cat */build/reports/tests/testDebugUnitTest/coroutine-leaks.txt 2>/dev/null || echo "No coroutine leak was reported."

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canary-reports-${{ matrix.slice }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/kover/**
            **/build/outputs/mapping/**/missing_rules.txt
            **/build/outputs/screenshotTest-results/**/diffs/**
          if-no-files-found: ignore
          retention-days: 7

  # The same report as ci.yml's nightly-report, under its own issue title so a break from upstream
  # is told apart from a toolchain-drift red. The issue stays in this repository: opening one in an
  # upstream from here would put this repo's failures on someone else's backlog.
  canary-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: ScottCooper92/binge-ci/.github/actions/nightly-report@b1a89672099bc3ac62a12b8d4f5d2ceb766aaef5 # v1.0.53
        with:
          result: ${{ needs.canary.result }}
          title: 'Consumer canary: main no longer builds against upstream heads'
          note: >-
            This build uses the heads of design-system/ (binge-design-system) and binge-companions/,
            not the pinned commits. If the nightly CI run is green, an upstream commit broke this app:
            the log names the submodule commits it built against, and bumping the pin would be red too.
            The canary-reports-* artifacts, one per slice that failed, are kept for seven days.
