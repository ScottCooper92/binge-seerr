name: Release

# Pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`) builds a signed release bundle,
# attaches it, with the R8 mapping, to a GitHub Release for that tag, and uploads it to Play's
# internal track as a draft.
#
# The upload is a draft because the app is not published yet, and Play's API refuses any other status
# for an unpublished app. Once the first review has passed, switch `status` to `completed` (#1695).
#
# Play's "what's new" notes live in distribution/whatsnew/. A note over Play's 500-character limit
# fails the run at the start, by .github/scripts/check-whats-new.sh, before anything is built.
#
# The keystore is the upload key, held in secrets and never in the repository:
#   RELEASE_KEYSTORE_BASE64  base64 -w0 release.keystore
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# app/build.gradle.kts reads the four RELEASE_* values from the environment. The Play upload reads the
# service account's key from PLAY_SERVICE_ACCOUNT_JSON.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build the signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check the what's new notes
        run: .github/scripts/check-whats-new.sh distribution/whatsnew build/play-whatsnew

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # The screenshot comparison is left out: ci.yml has already run it on the tagged commit, and on a
      # hosted runner it runs out of memory (v0.1.0's run was cancelled in :app:validateDebugScreenshotTest).
      # Lint, the unit tests, coverage and the instrumentation-test compile stay.
      - name: Verify
        run: ./gradlew build -x :app:validateDebugScreenshotTest

      - name: Derive the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' yields versionName '$version', which is not semver."
            exit 1
          fi
          # The run number keeps versionCode monotonic across tags without a counter to maintain;
          # the offset stays clear of anything uploaded by hand.
          code=$((GITHUB_RUN_NUMBER + 100))
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$version versionCode=$code"

      - name: Decode the release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # This app's own Firebase project. Without the secret the build still runs, with crash
      # reporting compiled out rather than failing.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: this release has no crash reporting."
          fi

      - name: Build the release bundle
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Verify the bundle is release-signed and shrunk
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          [ -s "$aab" ] || { echo "::error::$aab is missing or empty."; exit 1; }
          [ -s "$mapping" ] || { echo "::error::$mapping is missing or empty: R8 produced no mapping."; exit 1; }
          out=$(jarsigner -verify -verbose -certs "$aab" 2>&1) || { echo "::error::jarsigner could not verify $aab."; echo "$out"; exit 1; }
          grep -q "jar verified" <<<"$out" || { echo "::error::$aab is not signed."; echo "$out"; exit 1; }
          if grep -qiE "CN=Android Debug" <<<"$out"; then
            echo "::error::$aab is signed with the debug certificate: the RELEASE_* secrets did not reach the build."
            exit 1
          fi
          echo "Bundle is release-signed; mapping present ($(wc -c < "$mapping") bytes)."

      - name: Attach the bundle and mapping to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          app/build/outputs/bundle/release/app-release.aab
          app/build/outputs/mapping/release/mapping.txt
          --title "$GITHUB_REF_NAME" --generate-notes

      # The app is not published yet, so Play accepts only a draft (#1695 switches this to `completed`).
      # Last, so a Play failure cannot withhold the bundle from the GitHub Release.
      - name: Upload to Play's internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cooper.binge.companion.seerr
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: build/play-whatsnew
          tracks: internal
          status: draft
