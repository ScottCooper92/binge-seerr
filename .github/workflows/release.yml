name: Release

# Pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`) builds a signed release bundle,
# attaches it, with the R8 mapping, to a GitHub Release for that tag, and uploads it to Play's
# internal testing track (`internal`) and rolls it out to the testers listed there. Internal testing never reaches
# production on its own, and moving a release on to open testing is done in the Play Console.
#
# The release is `completed`, so it reaches the internal testers without a step in the Console. Play's API accepted only a
# draft while the app had no release rolled out (v0.3.1 and v0.4.0 were drafts), so if an upload is refused for that reason,
# put `status: draft` back and roll the release out in the Console (#1695).
#
# A failed run can be recovered by re-running the job: the GitHub Release step uploads over an existing release, so a
# Play failure after it does not stop the re-run reaching the Play step again.
#
# Play's "what's new" notes live in distribution/whatsnew/. A note over Play's 500-character limit
# fails the run at the start, by .github/scripts/check-whats-new.sh, before anything is built.
#
# The keystore is the upload key, held in secrets and never in the repository:
#   RELEASE_KEYSTORE_BASE64  base64 -w0 release.keystore
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# app/build.gradle.kts reads the four RELEASE_* values from the environment. The Play upload reads the
# service account's key from PLAY_SERVICE_ACCOUNT_JSON.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Read ci.yml's runs, for the green-main check below.
  actions: read

jobs:
  release:
    name: Build the signed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The submodules are private to the author: the default token reads this repository only. This one is read-only.
      - name: Mint a read-only token for the submodules
        id: submodule_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          repositories: binge-seerr,homelab-core,binge-design-system,binge-ci
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.submodule_token.outputs.token }}
          # The full history and every tag: the release notes start at the previous version tag, and a shallow
          # checkout has none to find.
          fetch-depth: 0

      # The tag must be on main, and main's CI (ci.yml's run for the push) must have finished green on that commit. Without this, a `v*` tag on
      # any commit releases it. A tag pushed seconds after the merge fails here: wait for CI, then re-run the job.
      - name: Check the tagged commit is a green main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit that has been merged."
            exit 1
          fi
          # Ask for ci.yml's run by workflow, not for a check named `build`: other workflows have a job of that name,
          # and one that finishes first would pass the gate before CI has decided. ci.yml's own `build` job is
          # green only if every other job ran as it should, and the run's conclusion is that job's.
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=20" \
            --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status // "none")/\(.conclusion // "none")"')
          if [ "$result" != "completed/success" ]; then
            echo "::error::CI's run on main for $GITHUB_SHA is '$result', not completed/success. Wait for CI on main to finish green, then re-run this job. If that run was cancelled by a later merge, re-run it first or tag the later commit."
            exit 1
          fi
          echo "CI is green on $GITHUB_SHA."

      - name: Check the what's new notes
        run: .github/scripts/check-whats-new.sh distribution/whatsnew build/play-whatsnew

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The screenshot comparison is left out: ci.yml has already run it on the tagged commit, and on a
      # hosted runner it runs out of memory (v0.1.0's run was cancelled in validateDebugScreenshotTest).
      # Lint, the unit tests, coverage and the instrumentation-test compile stay.
      - name: Verify
        run: ./gradlew build -x validateDebugScreenshotTest

      - name: Derive the version from the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' yields versionName '$version', which is not semver."
            exit 1
          fi
          # The run number keeps versionCode monotonic across tags without a counter to maintain;
          # the offset stays clear of anything uploaded by hand. The number is this workflow's own: it restarts
          # if the file is renamed or replaced by a caller of a shared workflow, and Play refuses a code that is
          # not above the last it has. So the floor below is the highest code used so far (v0.5.0's run 8, 108).
          # Raise it with each release, and set it before moving or renaming this workflow.
          floor=108
          code=$((GITHUB_RUN_NUMBER + 100))
          if [ "$code" -le "$floor" ]; then
            echo "::error::versionCode $code (run $GITHUB_RUN_NUMBER + 100) is not above the floor $floor, so Play would refuse it. Did the run counter restart? Raise the offset in this step."
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName=$version versionCode=$code"

      - name: Decode the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set: a release cannot be signed without it."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # This app's own Firebase project. Without the secret the build still runs, with crash
      # reporting compiled out rather than failing.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: this release has no crash reporting."
          fi

      # Without the key the app still builds, with analytics compiled out rather than failing.
      - name: Warn if PostHog is not configured
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        shell: bash
        run: |
          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "::warning::POSTHOG_API_KEY is not set: this release has no analytics."
          fi

      - name: Build the release bundle
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Verify the bundle is release-signed and shrunk
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          [ -s "$aab" ] || { echo "::error::$aab is missing or empty."; exit 1; }
          [ -s "$mapping" ] || { echo "::error::$mapping is missing or empty: R8 produced no mapping."; exit 1; }
          out=$(jarsigner -verify -verbose -certs "$aab" 2>&1) || { echo "::error::jarsigner could not verify $aab."; echo "$out"; exit 1; }
          grep -q "jar verified" <<<"$out" || { echo "::error::$aab is not signed."; echo "$out"; exit 1; }
          if grep -qiE "CN=Android Debug" <<<"$out"; then
            echo "::error::$aab is signed with the debug certificate: the RELEASE_* secrets did not reach the build."
            exit 1
          fi
          echo "Bundle is release-signed; mapping present ($(wc -c < "$mapping") bytes)."

      # Generated notes list every commit since the previous release, and with none they list the whole
      # history, which GitHub refuses over 125000 characters (v0.1.0's first run). So they start at the
      # previous version tag; the first release has none, and takes the annotated tag's message instead.
      - name: Attach the bundle and mapping to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null); then
            echo "Release notes start at $previous."
            notes=(--generate-notes --notes-start-tag "$previous")
          else
            echo "No earlier version tag: the release notes are the message of $GITHUB_REF_NAME."
            notes=(--notes-from-tag)
          fi
          assets=(
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          )
          # A re-run after a failed Play upload finds the release already there: replace its assets instead.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release: replacing its assets."
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" "${notes[@]}"
          fi

      # Last, so a Play failure cannot withhold the bundle from the GitHub Release.
      - name: Upload to Play's internal testing track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cooper.binge.companion.seerr
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: build/play-whatsnew
          tracks: internal
          status: completed
          # No `changesNotSentForReview`: Play now sends this app's changes for review itself and refuses an edit that
          # sets it (v0.5.0's upload failed on it). v0.3.0 failed the other way, before the app's first review, so if
          # Play asks for the flag again, the error names it.
