name: Distribute debug build

# Manual only: pushes a debug build to Firebase App Distribution's testers, for installing outside
# the LAN without touching adb. App Distribution accepts the same versionCode/versionName on every
# upload, unlike a Play track — it treats a same-version upload as an *update* to one existing
# release rather than a new one, so without something to tell builds apart every dispatch collapses
# onto the same release and testers (and whoever's reading the console) can't tell which commit they
# have. The commit short SHA in versionName below is that something; versionCode stays fixed at 1,
# since nothing here needs Play's monotonically-increasing kind of version bump.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Manual debug build'

permissions:
  contents: read

jobs:
  distribute:
    name: Build & distribute debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # This app's own Firebase project. Without the secret the build still runs, with crash
      # reporting compiled out rather than failing — same as release.yml.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: this build has no crash reporting."
          fi

      # VERSION_NAME feeds app/build.gradle.kts:65's `System.getenv("VERSION_NAME") ?: "0.1.0"` — the
      # same env var the release build reads, just with a short SHA appended so each dispatch on a
      # different commit produces a distinguishable release in Firebase's list.
      - name: Build debug APK
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: VERSION_NAME="0.1.0-${GITHUB_SHA:0:8}" ./gradlew :app:assembleDebug --stacktrace

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          # "Binge Seerr Debug": the Firebase app registered for the debug build's own package
          # (io.github.scottcooper92.binge.seerr.debug), not the release app's.
          appId: 1:95035443283:android:434354a6d8e29d06999ea6
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: scottalancooper@gmail.com
          releaseNotes: ${{ inputs.release_notes }}
          file: app/build/outputs/apk/debug/app-debug.apk
