name: Device smoke (minified)

# The one emulator lane (#86). It asserts something ci.yml cannot: that the release keep rules hold
# across a real Binder, on the minified build, for the exported Service, the generated stubs and the
# protobuf runtime. That answer is a pure function of the committed tree plus the toolchain, so it is
# triggered by the paths that can change it, with a weekly run behind that for the one input that
# varies with time rather than with a diff: the hosted runner image and the system image.
#
# The lane itself is homelab-ci's shared device-smoke workflow (hosted runner, KVM, freed disk, the AVD
# cache, the zero-tests guard, a non-fatal upload). This file owns only the triggers, the
# concurrency group and the weekly report.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to run against
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/**'
      - 'app/src/main/keepRules/**'
      - 'app/src/debug/keepRules/**'
      - 'app/src/main/kotlin/com/cooper/binge/companion/seerr/service/**'
      - 'app/src/main/kotlin/com/cooper/binge/companion/seerr/seerr/**'
      # The Seerr client lives in :data now, so a change to it, or to what builds it, is a change to what this lane proves.
      - 'data/build.gradle.kts'
      - 'data/src/main/kotlin/com/cooper/binge/companion/seerr/seerr/**'
      - 'binge-companions'
      - 'libs.versions.toml'
      - '.github/workflows/device-smoke.yml'
  schedule:
    - cron: '0 6 * * 1'

# The weekly run has its own group. Sharing main's with a push would let a push cancel it mid-run,
# and a cancelled scheduled run is reported (a job that hits its timeout is `cancelled`, not
# `failure`), so that would raise a false alarm.
concurrency:
  group: device-smoke-${{ github.event_name == 'schedule' && 'weekly' || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion-smoke:
    name: Handshake and status over Binder on a minified build
    # The shared lane's `save-avd-cache` runs `gh cache delete` before it saves. Without
    # `actions: write` the delete gets a 403 that `|| true` hides, and the cache freezes at its
    # first content.
    permissions:
      contents: read
      actions: write
    uses: ScottCooper92/homelab-ci/.github/workflows/device-smoke.yml@de44a7c780434385c40ecf599b7f3ebd10e7fb76 # v1.0.59
    with:
      private_submodules: homelab-core,homelab-design-system,homelab-ci
      ref: ${{ github.event.inputs.ref }}
      submodules: recursive
      device: smokeAtdApi34
      api_level: '34'
      system_image_source: aosp-atd
      default_branch: main
      tasks: ':app:smokeAtdApi34DebugAndroidTest -PminifyDebug'
      expected_tests: handshakeAndStatusCrossTheBinderOnTheMinifiedBuild theDemoAnswersAcrossTheBinderWithNoServer
      retention_days: 7
      capture_logcat: true
    secrets:
      REVIEWER_APP_ID: ${{ secrets.REVIEWER_APP_ID }}
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

  # The weekly run is the backstop for what changes with time rather than with a diff (the runner
  # image, the system image), and it has no PR or push to carry a failure, so without this a red
  # one is a mark in the Actions tab that nothing points at. One issue stays open while the
  # scheduled run is red and closes itself on the next green one. Scheduled runs only: a push or a
  # manual dispatch already has someone watching it. The same report as ci.yml's nightly-report,
  # with its own issue.
  scheduled-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: companion-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: ScottCooper92/homelab-ci/.github/actions/nightly-report@de44a7c780434385c40ecf599b7f3ebd10e7fb76 # v1.0.59
        with:
          result: ${{ needs.companion-smoke.result }}
          title: Weekly device smoke is failing on main
          note: >-
            Nothing was pushed to cause this, so suspect the environment first: a runner image or
            Android SDK update, the aosp-atd system image, or /dev/kvm on the hosted runner. The
            device-smoke-results artifact is kept for seven days.
