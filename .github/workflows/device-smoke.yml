name: Device smoke (minified)

# The one emulator lane (#86). It asserts something ci.yml cannot: that the release keep rules hold
# across a real Binder, on the minified build, for the exported Service, the generated stubs and the
# protobuf runtime. That answer is a pure function of the committed tree plus the toolchain, so it is
# triggered by the paths that can change it, with a weekly run behind that for the one input that
# varies with time rather than with a diff: the hosted runner image and the system image.
#
# It runs on a hosted runner because the emulator needs KVM, and it frees disk first because a stock
# ubuntu-latest has too little left for an AVD once the SDK and this build's dependencies have landed.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to run against
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/**'
      - 'app/src/main/keepRules/**'
      - 'app/src/main/kotlin/io/github/scottcooper92/binge/seerr/service/**'
      - 'app/src/main/kotlin/io/github/scottcooper92/binge/seerr/seerr/**'
      - 'binge-integrations'
      - 'libs.versions.toml'
      - '.github/workflows/device-smoke.yml'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: device-smoke-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  companion-smoke:
    name: Handshake and status over Binder on a minified build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          docker system prune -af || true
          df -h /

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept the SDK licences the system image needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Enable KVM for the runner user
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check the runner can virtualise
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on this runner, so no emulator can run here."
            exit 1
          fi
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm exists but is not writable by $(id -un)."
            exit 1
          fi
          echo "/dev/kvm present and writable."

      # showKernelLogging is what makes an emulator that fails to start say why: without it the
      # failure reads as an empty error list.
      - name: Create the managed-device snapshot
        run: >
          ./gradlew :app:smokeAtdApi34Setup
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true
          --info

      - name: Run the smoke on the minified debug build
        run: >
          ./gradlew :app:smokeAtdApi34DebugAndroidTest
          -PminifyDebug
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-smoke-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
