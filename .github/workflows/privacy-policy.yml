name: Privacy policy

# docs/listing/privacy.md is the source of the privacy policy, and it is reviewed with the code it
# describes. The policy is published from the public app-feedback repository's Pages site, at
# https://scottcooper92.github.io/app-feedback/seerr/privacy/, which is the URL the Play listing and
# the app link to (#2087). This repository is private, so its own Pages site is not the home.
#
# Whenever the policy changes on main, this opens a pull request on app-feedback that replaces the
# body of docs/seerr/privacy/index.md with the policy. That file's front matter and its "Last
# updated / Change history" line are kept, and only the date in that line is refreshed, to the date
# of the last commit to privacy.md. The pull request is the review: nothing is published until it
# merges there.
#
# One branch, force-pushed, and one open pull request, reused: a second change before the first
# merges updates the same pull request instead of opening another.
#
# The token is a GitHub App's, limited to app-feedback with contents and pull requests write, and is
# minted for this run only. It is not a personal access token. If the App is not installed on
# app-feedback, the token step fails and says so.
on:
  push:
    branches: [main]
    paths:
      - docs/listing/privacy.md
      - .github/workflows/privacy-policy.yml
  workflow_dispatch:

# One sync at a time. A newer run waits rather than cancelling one already pushing, so the branch
# is never left half-updated and the last policy to merge is the one proposed.
concurrency:
  group: privacy-policy-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: sync/seerr-privacy-policy
      TARGET: docs/seerr/privacy/index.md
    steps:
      # Full history, so the last-updated date is that of the last commit to change the policy. A
      # shallow clone would give the date of whatever commit triggered the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mint a token for app-feedback
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.AUTHOR_APP_ID }}
          private-key: ${{ secrets.AUTHOR_APP_PRIVATE_KEY }}
          owner: ScottCooper92
          repositories: app-feedback
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScottCooper92/app-feedback
          path: app-feedback
          ref: main
          token: ${{ steps.token.outputs.token }}

      # The page is the front matter and the heading, then the last-updated line, then the policy
      # without its own heading. Every part this does not write is checked to be where it is
      # expected, so a change to the page's layout stops the sync instead of being overwritten.
      - name: Build the page
        run: |
          set -euo pipefail
          source=docs/listing/privacy.md
          page="app-feedback/${TARGET}"
          [ "$(head -n 1 "$source" | cut -c1-2)" = '# ' ] || {
            echo "::error file=$source::The policy must start with a '# ' heading"
            exit 1
          }
          [ -z "$(sed -n 2p "$source")" ] || {
            echo "::error file=$source::The policy's heading must be followed by a blank line"
            exit 1
          }
          [ "$(head -n 1 "$page")" = '---' ] || {
            echo "::error::$TARGET does not start with front matter"
            exit 1
          }
          front_end=$(awk 'NR > 1 && /^---$/ { print NR; exit }' "$page")
          [ -n "$front_end" ] || {
            echo "::error::$TARGET has no end to its front matter"
            exit 1
          }
          history=$(grep -m1 -E '^\*Last updated [0-9]{4}-[0-9]{2}-[0-9]{2}\. \[Change history\]' "$page") || {
            echo "::error::$TARGET has no 'Last updated ... Change history' line"
            exit 1
          }
          updated=$(git log -1 --format=%cs -- "$source")
          history=$(printf '%s' "$history" | sed -E "s/^\*Last updated [0-9]{4}-[0-9]{2}-[0-9]{2}\./*Last updated ${updated}./")
          {
            head -n "$front_end" "$page"
            head -n 1 "$source"
            printf '\n%s\n\n' "$history"
            tail -n +3 "$source"
          } > page.new
          mv page.new "$page"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ScottCooper92/app-feedback
          SOURCE_COMMIT: ${{ github.sha }}
          BOT_ID: ${{ vars.AUTHOR_BOT_ID }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          : "${BOT_ID:?The AUTHOR_BOT_ID repository variable is not set}"
          cd app-feedback
          if git diff --quiet -- "$TARGET"; then
            echo "The published policy already matches."
            exit 0
          fi
          git config user.name "binge-pr-author[bot]"
          git config user.email "${BOT_ID}+binge-pr-author[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$TARGET"
          git commit -m "docs: sync the Seerr Companion privacy policy" \
            -m "Source: ${SOURCE_URL}"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          body="Syncs the Seerr Companion privacy policy from its source, \`docs/listing/privacy.md\`, at ${SOURCE_URL}. Only the body of the policy and the date in its last-updated line change. Merging this publishes it."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "docs: sync the Seerr Companion privacy policy" --body "$body"
          fi
