name: Privacy page redirect

# The privacy policy moved to https://scottcooper92.github.io/app-feedback/seerr/privacy/ (#2087) and privacy-policy.yml no
# longer deploys this repository's Pages site. Builds released before that move still open this site's /privacy/ page from the
# About row, and the page the last deployment left there is a copy that nothing updates (#2103). GitHub Pages cannot send an HTTP
# redirect, so this publishes a page that carries a meta refresh, a canonical link and a visible link to the new URL.
#
# The page is docs/listing/legacy-privacy-redirect.html. It is self-contained, with one inline style and no script, font or
# image from anywhere else, so opening it sends no request to a third party. It replaces the whole site, which only ever held
# the privacy page.
#
# This needs Pages turned on with GitHub Actions as its source (Settings > Pages), as the earlier workflow did.
on:
  push:
    branches: [main]
    paths:
      - docs/listing/legacy-privacy-redirect.html
      - .github/workflows/privacy-redirect.yml
  workflow_dispatch:

# One deployment at a time. A newer run waits rather than cancelling one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The redirect, the canonical link and the visible link must all name the one URL, and the page must load nothing.
      - name: Stage the page
        env:
          SOURCE: docs/listing/legacy-privacy-redirect.html
          TARGET_URL: https://scottcooper92.github.io/app-feedback/seerr/privacy/
        run: |
          set -euo pipefail
          grep -qF "http-equiv=\"refresh\" content=\"0; url=${TARGET_URL}\"" "$SOURCE"
          grep -qF "rel=\"canonical\" href=\"${TARGET_URL}\"" "$SOURCE"
          grep -qF "<a href=\"${TARGET_URL}\">" "$SOURCE"
          if grep -Eni '<script|<iframe|<img|@import|url\(|<link rel="stylesheet"' "$SOURCE"; then
            echo "::error file=$SOURCE::The page loads an external resource"
            exit 1
          fi
          mkdir -p _site/privacy
          cp "$SOURCE" _site/privacy/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
