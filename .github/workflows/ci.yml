name: CI

# The gate for this repository, and the trigger for every bot in this directory:
# bot-review fires on a successful run of this workflow, author-ci-fix on a failed
# one, and author-conflicts on one completing against main. They match it by NAME,
# so renaming this workflow silently unhooks all three.
#
# One job, deliberately. `./gradlew build` already runs every check `CLAUDE.md` lists under
# Gates, because the plugins wire themselves into `check` (or `app/build.gradle.kts` does
# it by hand) and `build` depends on `check`. Splitting them into
# separate jobs would buy parallelism this build is far too small to need, and would
# cost a second required status check to keep in sync with branch protection.
#
# Deliberately NO paths-ignore, matching binge-companions. bot-review requires a
# SUCCESSFUL run of this workflow against the head, so a skipped run means a PR that
# is never reviewed. .ai/ holds the rules the bots themselves read, so a docs filter
# would bypass review on exactly the changes that most need it.
on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and without it a PR opened as a
    # draft and later promoted never gets a first run — so bot-review, which only
    # fires on a run of this workflow completing, never sees it either.
    types: [opened, synchronize, reopened, ready_for_review]
  # A canary for what can turn the build red with no commit here: a runner image or Android
  # SDK update, a toolchain drift. Without it the next PR to run takes the blame. It builds
  # main, and the three bots skip it (see their `if:`) because there is no PR for them to act
  # on. Scheduled workflows only run on the default branch.
  schedule:
    - cron: '0 4 * * *'

# Per-ref group: a new commit on the same branch/PR cancels its superseded run. The event
# name keeps the nightly run, which shares main's ref, from cancelling or being cancelled
# by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Skip while a PR is a draft, so a stack can be opened as drafts and promoted one
    # at a time without each queued run preempting the last. Push events to main always
    # run — `pull_request` is null there. A draft therefore reports conclusion
    # "skipped", which author-ci-fix and bot-review both already treat as "not green".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Job level, not workflow level: only the submodule-pin step reads a PR label (#561).
    permissions:
      contents: read
      pull-requests: read
    # Generous against a build that currently takes a couple of minutes, so it catches
    # a hang rather than a slow day. The Android SDK is preinstalled on the runner
    # image; nothing here installs one.
    timeout-minutes: 30
    steps:
      # The contracts and SDK are a submodule (see settings.gradle.kts); without this the
      # included build is an empty directory and Gradle fails at settings evaluation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # #421: a submodule pin can be a commit that only exists on an unmerged branch of its own
      # repo — a deliberate case while `hold` gates the merge on it (#420), or one nobody remembers
      # is unmerged once `hold` comes off. Every pinned commit has to be an ancestor of that
      # submodule's own default branch, or this PR still needs to carry `hold`; nothing here reads
      # `.gitmodules` for which pins are "supposed" to be held, only whether each one actually
      # merged. Runs before the build so an unmerged pin fails fast rather than after a full Gradle
      # run.
      - name: Check submodule pins are merged upstream
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read live, not from the event payload: adding `hold` starts no run, and a re-run
          # replays the original payload, so the payload still says the label is absent (#561).
          HELD=$(gh pr view "$PR_NUMBER" --json labels --jq 'any(.labels[]; .name == "hold")')
          : > /tmp/unmerged-submodules.txt
          git submodule foreach --quiet '
            url=$(git config --get remote.origin.url)
            default_branch=$(git ls-remote --symref "$url" HEAD | awk "NR==1{print \$2}" | sed "s#^refs/heads/##")
            # actions/checkout leaves each submodule shallow, and a plain fetch of the default
            # branch would only bring its tip in, not the history between it and $sha1 - an
            # ancestry check against that truncated graph reports every pin "unmerged" regardless
            # of whether it actually is. The huge depth is the standard "just unshallow" idiom.
            git fetch --quiet --depth=2147483647 origin "$default_branch"
            if git merge-base --is-ancestor "$sha1" "origin/$default_branch"; then
              echo "$name: $sha1 is merged into $default_branch"
            else
              echo "$name: $sha1 is NOT an ancestor of $default_branch" >&2
              echo "$name" >> /tmp/unmerged-submodules.txt
            fi
          '
          if [ -s /tmp/unmerged-submodules.txt ]; then
            unmerged=$(paste -sd, /tmp/unmerged-submodules.txt)
            echo "::warning::Submodule pin(s) not merged upstream: $unmerged"
            if [ "$HELD" != "true" ]; then
              echo "::error::Unmerged submodule pin(s) without the 'hold' label: $unmerged"
              exit 1
            fi
          fi

      # JDK 17, matching Binge rather than binge-companions' 21. The extracted code
      # targets jvmTarget 17 and the AGP in `libs.versions.toml` is what Binge builds with, so the toolchain
      # here is the one the extraction arrives expecting.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # --continue surfaces every failure in one run rather than stopping at the first,
      # which matters most to author-ci-fix: it gets exactly one repair attempt per
      # commit, and a log showing only the first of three failures spends that attempt
      # fixing a third of the problem.
      - name: Build, test and lint
        run: ./gradlew build --continue

      # Reports for triaging a red run. Listed explicitly rather than globbing
      # **/build/reports/ — the greedy glob is fail-OPEN, so every new report type
      # Gradle and AGP invent silently reappears in the artifact. Both the test reports
      # and the lint results are named, because a red run here is as likely to be lint
      # as it is to be a failing test, and author-ci-fix triages from what it can read. detekt
      # and kover are named for the same reason: `build` runs both, and without their reports a
      # red detekt or a coverage-floor failure leaves only the log. Screenshots are narrowed to
      # the diffs, not the whole results tree. `build` is one Gradle step, so there is no
      # failed-step gate to hang that on; if-no-files-found covers a run with no diffs.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            **/build/reports/kover/**
            **/build/outputs/screenshotTest-results/**/diffs/**
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'schedule' && 7 || 1 }}

  # Lints the workflow files, which is where a typo turns into a silent startup_failure. It lives
  # in this workflow rather than its own so there is still one required check to keep in sync with
  # branch protection, and it runs on workflow-only diffs because this repo has no paths-ignore.
  # actionlint cannot see across a `uses:` reference to a reusable workflow, so the callers'
  # permissions are still proved by running them.
  actionlint:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Same invocation as binge-ci's own CI: a pinned release verified against its published
      # checksum. --severity=warning, not the default, because info fires SC2016 on single-quoted
      # scripts where the quotes are correct.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck 'shellcheck --severity=warning'

  # A red nightly has no PR or push to carry it, so without this it is a red mark in the
  # Actions tab that nothing points at. One issue stays open while the canary is red and
  # closes itself on the next green run, so an open one means "still broken", not "old".
  # Anything but success reports: a job that hits its timeout is `cancelled`, not `failure`, and the
  # nightly has its own concurrency group, so nothing else supersedes it.
  nightly-report:
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const title = 'Nightly CI is failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })).find((i) => !i.pull_request && i.title === title);

            if (process.env.BUILD_RESULT === 'success') {
              if (!open) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number,
                body: `The nightly run is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
              });
            } else {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Still failing: ${runUrl}`,
                });
                return;
              }
              await github.rest.issues.create({
                owner, repo, title,
                body: [
                  `The scheduled run of CI failed: ${runUrl}`,
                  '',
                  'Nothing was pushed to cause this, so suspect the environment first: a runner image or Android SDK update, or a toolchain drift. The build-reports artifact is kept for seven days.',
                  '',
                  'This issue closes itself on the next green nightly run.',
                ].join('\n'),
              });
            }
