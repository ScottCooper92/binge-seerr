name: Restore AVD cache
description: >
  Restores a Gradle Managed Device's created AVD (with its post-boot snapshot) and its downloaded
  system image package, so a device-smoke run does not re-download and re-boot from scratch on
  every dispatch. Pair with save-avd-cache, which writes the entry this reads.

inputs:
  device:
    description: The Gradle Managed Device name (e.g. smokeAtdApi34), as declared in app/build.gradle.kts.
    required: true
  api-level:
    description: The device's apiLevel. Folded into the cache key so a config change can't restore a mismatched AVD under the same key.
    required: true
  system-image-source:
    description: The device's systemImageSource (e.g. aosp-atd). Folded into the cache key for the same reason.
    required: true

outputs:
  cache-hit:
    description: "true on an exact key match; unset otherwise (a cache miss is not a failure - Setup falls back to a full download+boot)."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # ~/.android/avd/gradle-managed is where GMD writes the AVD it creates plus the default_boot
    # snapshot from Setup's boot-then-stop. $ANDROID_SDK_ROOT/system-images is the separately
    # downloaded package the AVD is built from, and $ANDROID_SDK_ROOT/emulator is the emulator
    # binary package itself - caching only the first two still leaves the third to redownload on a
    # miss of its own kind, so all three live under one key.
    #
    # emulator is load-bearing, not an optimisation (Binge#2753): Setup's own install branch only
    # triggers on `!sdkImageDirectoryProvider(imageHash).isPresent()`, so a system-image cache hit
    # skips it entirely - on a runner image that ships no `emulator` package (confirmed: it is
    # absent from the `SDK Manager found the following installed packages` line every run prints),
    # that left `VersionedSdkLoader.emulatorDirectoryProvider` with nothing to resolve and Setup
    # failed with a bare `MissingValueException` (`ManagedDeviceInstrumentationTestSetupTask.kt:270`,
    # found via javap against the vendored AGP 9.3.2 jar - GitHub's job logs don't carry AGP's own
    # source). Restoring `emulator` alongside `system-images` keeps that isPresent() check honest:
    # everything the skipped install branch would have installed is already there.
    #
    # *.lock and active_gradle_devices* are excluded, not merely left alone: a stale multi-process
    # lock file restored as "in use" breaks the run that restores it, so save-avd-cache must not be
    # able to write one back in even if it runs anyway.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/gradle-managed
          !~/.android/avd/gradle-managed/**/*.lock
          !~/.android/avd/gradle-managed/**/active_gradle_devices*
          ${{ env.ANDROID_SDK_ROOT }}/system-images
          ${{ env.ANDROID_SDK_ROOT }}/emulator
        # Bump the -v suffix to force a clean miss when the cached paths change.
        key: gmd-avd-${{ runner.os }}-${{ inputs.device }}-${{ inputs.api-level }}-${{ inputs.system-image-source }}-main-v1
