# Mirrors Binge's catalog for the versions the extracted Seerr code will need, so the
# extraction is a code move rather than a toolchain negotiation. Kept deliberately small:
# entries are added when the extraction needs them, not in anticipation of it.
#
# AGP 9 has built-in Kotlin support and rejects the separate `org.jetbrains.kotlin.android`
# plugin being APPLIED — but it compiles with whichever Kotlin Gradle plugin is on the build
# classpath, and with none declared that is the 2.2 it embeds. Declaring the plugin `apply false`
# in the root build puts 2.4.10 there, which is what Binge does and what the included
# binge-integrations build compiles the contracts and SDK with; a mismatch fails as "compiled with
# an incompatible version of Kotlin" on every SDK class.
[versions]
agp = "9.3.2"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
ktlint = "14.2.0"
# Must agree with binge-integrations' catalog: the SDK brings grpc-binder at its version, and the
# in-process transport the tests use has to be the same release or the two disagree on internals.
grpc = "1.68.1"
kotlinxCoroutines = "1.11.0"
# KSP is the Hilt compiler's host; the pair is the one Binge builds with at this Kotlin.
ksp = "2.3.11"
hilt = "2.60.1"
kotlinxSerializationJson = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
datastore = "1.2.1"
composeBom = "2026.08.00"
# Pinned ahead of the BOM to the version binge-design-system pins: its expressive theme reads
# material3 APIs the BOM's stable line does not have, and a consumer that includes that build has
# to agree with it or resolution silently picks one of the two.
material3 = "1.5.0-alpha27"
activityCompose = "1.13.0"
lifecycle = "2.11.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
# Version-less on purpose: both resolve to projects of the included binge-integrations build.
binge-integration-contracts = { module = "io.github.scottcooper92:contracts" }
binge-integration-sdk = { module = "io.github.scottcooper92:sdk" }
# Version-less for the same reason: resolves to the included binge-design-system build.
binge-designsystem = { module = "com.binge:designsystem" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
