# Mirrors Binge's catalog for the versions the extracted Seerr code will need, so the
# extraction is a code move rather than a toolchain negotiation. Kept deliberately small:
# entries are added when the extraction needs them, not in anticipation of it.
#
# AGP 9 has built-in Kotlin support and rejects the separate `org.jetbrains.kotlin.android`
# plugin being APPLIED — but it compiles with whichever Kotlin Gradle plugin is on the build
# classpath, and with none declared that is the 2.2 it embeds. Declaring the plugin `apply false`
# in the root build puts 2.4.10 there, which is what Binge does and what the included
# binge-integrations build compiles the contracts and SDK with; a mismatch fails as "compiled with
# an incompatible version of Kotlin" on every SDK class.
[versions]
agp = "9.4.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
# The version binge-design-system pins; the TV focus tests drive a real D-pad on the JVM with it.
robolectric = "4.16.1"
# The version binge-design-system pins: a baseline recorded by one renderer has to validate
# under the other, and these baselines are compared against components from that build.
screenshot = "0.0.1-alpha15"
ktlint = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
# Must agree with binge-integrations' catalog: the SDK brings grpc-binder at its version, and the
# in-process transport the tests use has to be the same release or the two disagree on internals.
grpc = "1.68.1"
kotlinxCoroutines = "1.11.0"
# KSP is the Hilt compiler's host; the pair is the one Binge builds with at this Kotlin.
ksp = "2.3.11"
hilt = "2.60.1"
androidxHilt = "1.4.0"
navigation3 = "1.1.7"
# The list-detail scaffold as a Navigation 3 SceneStrategy. Its own POM asks for navigation3 1.0.0;
# 1.1.7 above wins the resolution and the scene API it compiles against (androidx.navigation3.scene)
# is unchanged there. Pinned to the stable line rather than 1.4.0-alpha, which buys nothing here.
material3Adaptive = "1.3.0"
kotlinxSerializationJson = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.4.0"
datastore = "1.2.1"
firebaseBom = "34.18.0"
firebaseCrashlytics = "3.0.8"
googleServices = "4.5.0"
posthog = "3.55.2"
# Play Services, for Block Store only: it is the one carrier that survives a device transfer,
# and the app degrades to "sign in again" wherever Play Services is not there.
blockstore = "16.4.0"
# The device lane's instrumentation stack, at the versions Binge pins.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
composeBom = "2026.08.00"
# Pinned ahead of the BOM to the version binge-design-system pins: its expressive theme reads
# material3 APIs the BOM's stable line does not have, and a consumer that includes that build has
# to agree with it or resolution silently picks one of the two.
material3 = "1.5.0-alpha27"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
browser = "1.9.0"
# Backports the API 31 splash to API 21+, which is what gets a television one at all.
coreSplashscreen = "1.2.0"
# Only for the sign-in fields: it builds the saved-password request whose bundles a credential
# provider parses, so those keys are not spelled out here.
credentials = "1.6.0"
paging = "3.5.1"
room = "2.8.4"
workManager = "2.11.2"
# The version binge-design-system pins: its components load their artwork with it, and a consumer
# that includes that build has to agree with it or resolution silently picks one of the two.
coil = "3.6.1"
# Drag-to-reorder for LazyColumn, built on Modifier.animateItem() rather than a hand-rolled
# animation. Published as a Kotlin Multiplatform artifact; this module resolves its Android variant.
reorderable = "2.5.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
# Version-less on purpose: both resolve to projects of the included binge-integrations build.
binge-companion-contracts = { module = "io.github.scottcooper92:contracts" }
binge-companion-sdk = { module = "io.github.scottcooper92:sdk" }
# Version-less for the same reason: resolves to the included binge-design-system build.
binge-designsystem = { module = "com.binge:designsystem" }
binge-designsystem-tv = { module = "com.binge:designsystem-tv" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3Adaptive" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
posthog-android = { module = "com.posthog:posthog-android", version.ref = "posthog" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# The renderer the screenshot frames run under; version from the BOM.
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
play-services-blockstore = { module = "com.google.android.gms:play-services-auth-blockstore", version.ref = "blockstore" }
# The canonical Task-to-coroutine adapter; writing one by hand in a repository that is read as
# documentation would be teaching the wrong lesson.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
