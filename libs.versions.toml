# Mirrors Binge's catalog for the versions the extracted Seerr code will need, so the
# extraction is a code move rather than a toolchain negotiation. Kept deliberately small:
# entries are added when the extraction needs them, not in anticipation of it.
#
# There is no `kotlin` entry. AGP 9 has built-in Kotlin support and rejects the separate
# `org.jetbrains.kotlin.android` plugin, so the Kotlin version comes from AGP. Binge declares
# that plugin in its root build file but never applies it, for the same reason.
[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
ktlint = "14.2.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
